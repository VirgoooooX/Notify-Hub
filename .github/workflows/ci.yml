name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked backend dependencies
        run: uv sync --locked --extra dev --extra mp-browser
      - name: Check formatting
        run: uv run --locked --extra dev --extra mp-browser ruff format --check backend plugins
      - name: Lint
        run: uv run --locked --extra dev --extra mp-browser ruff check backend plugins
      - name: Type check
        env:
          PYTHONPATH: backend
        run: uv run --locked --extra dev --extra mp-browser mypy backend plugins
      - name: Migrate an empty SQLite database
        env:
          NOTIFY_HUB_DATABASE_URL: sqlite+aiosqlite:////tmp/notify-hub-ci.db
        run: cd backend && uv run --locked --extra dev --extra mp-browser alembic upgrade head
      - name: Test
        run: uv run --locked --extra dev --extra mp-browser pytest
      - name: Audit Python dependencies
        run: uv run --locked --extra dev --extra mp-browser --with "pip-audit>=2.10,<3" pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: notify-hub:ci

      - name: Scan main image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: notify-hub:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Build MP Browser CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.mp-browser
          push: false
          load: true
          tags: notify-hub-mp-browser:ci

      - name: Scan MP Browser image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: notify-hub-mp-browser:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository secrets
        uses: gitleaks/gitleaks-action@v2
